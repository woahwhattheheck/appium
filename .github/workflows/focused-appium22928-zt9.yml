name: Focused hoisted-driver acceptance ZT9
on:
  push:
    branches: ['validation/appium22928-hoisted-20261009-zt9']
permissions:
  contents: read
jobs:
  hoisted-driver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify the unchanged original PR source
        run: |
          git merge-base --is-ancestor aed38383eeb0749611e530f1ad5301ae070c10a0 HEAD
          git diff --quiet aed38383eeb0749611e530f1ad5301ae070c10a0 HEAD -- . ':!.github/workflows/focused-appium22928-zt9.yml'
          test "$(git hash-object packages/appium/lib/extension/manifest.ts)" = 03348719662c9f2111d22e16beb444fc0601bcc4
          test "$(git hash-object packages/appium/test/unit/extension/manifest.spec.ts)" = 0b6e3e0e463e67ea10b44a2f9339a2e36b280e98
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile the touched package and required test fixtures
        run: npx --no-install tsc -b packages/appium packages/relaxed-caps-plugin packages/fake-driver
      - name: Run only the reported hoisted-driver regression
        working-directory: packages/appium
        run: |
          node --test --experimental-test-module-mocks --test-concurrency=1 --enable-source-maps --test-timeout=5000 --test-reporter=tap --test-name-pattern='should discover the driver via module resolution' ./build/test/unit/extension/manifest.spec.js
