name: Targeted Test
on: workflow_dispatch
jobs:
  test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:unit -- packages/appium/test/unit/extension/manifest.spec.ts